# Dependabot keeps third-party dependencies up to date by opening PRs.
# Two ecosystems are watched: npm (your runtime/devDeps) and GitHub Actions
# (the actions referenced in .github/workflows/*.yml).
#
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    commit-message:
      # Conventional Commits format. `include: scope` automatically appends
      # the package ecosystem to the prefix, so we get `chore(deps): ...`
      # for production deps and `chore(deps-dev): ...` for dev deps.
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    # Group routine patch/minor bumps so you don't get 20 PRs every Monday.
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Major version bumps still arrive as individual PRs so you can review them.
    # Pin packages we don't want auto-upgraded across major versions.
    ignore:
      # TypeScript 6 has breaking changes; bump manually after auditing.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ───────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
      include: scope
